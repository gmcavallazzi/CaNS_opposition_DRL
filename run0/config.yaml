# General parameters
total_timesteps: 1800000  # n_actions * 400
maxprocs: [64]
halo: 0

# Network architecture
net_arch:
  qf_conv: [32, 64, 32]     # Convolutional layers for spatial processing
  qf_mlp: [256, 128]        # MLP layers after convolution
  pi: [8]                   # Actor network architecture   

# Action space parameters
action:
  om_max: 0.064
  scaling_factor: 2.0  # Multiplier for actions sent to CaNS

# Grid parameters
grid:
  target:
    i: 64
    j: 64

# Reward parameters
reward:
  dpdx:
    min: -0.0045
    max: -0.0018
  global_weight: 1.0
  diversity:
    enable: false
    weight: -0.1          # Negative weight to penalize low diversity
    min_std_threshold: 0.01  # Minimum action std to avoid penalty

# Model parameters
model:
  learning_rate: 0.001
  buffer_size: 5_000_000
  weight_decay: 0.00001  # Add L2 regularization
  batch_size: 32
  tau: 0.01
  gamma: 0.995
  train_freq: 300
  gradient_steps: 64
  action_noise:
    initial_sigma: 0.1    # Starting noise level - higher for better initial exploration
    final_sigma: 0.01    # Final noise level - low but non-zero to maintain some exploration
    decay_episodes: 400   # Number of episodes to decay from initial to final (50% of total episodes)
    decay_type: "exponential"  # "linear", "exponential", or "polynomial"

# Field shift parameters
field_shift:
  enable: true
  dt: 0.0765  # Time step for shifting
  domain_size:
    Lx: 2.67  # Domain length in x direction
    Ly: 0.8   # Domain length in y direction

# Training parameters
training:
  start_episode_length: 1800  # Fixed episode length in steps - all episodes have exactly this many steps
  save_freq: 3600
  gradient_clip: 1.0  # Enable gradient clipping
  xavier_init_gain: 1.5  # Higher gain for Xavier initialization

